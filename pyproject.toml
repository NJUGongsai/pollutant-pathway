[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enzymecage-crew"
version = "0.1.0"
description = "EnzymeCrew: LangGraph-based multi-agent orchestration for enzyme-microbe recommendation"
requires-python = ">=3.10"
license = {text = "Internal R&D License"}
authors = [{name = "Axl Huang"}]

dependencies = [
    # LangGraph 编排
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    # LLM
    "dashscope>=1.17.0",
    # 化学
    "rdkit>=2024.3.1",
    # 数据验证
    "pydantic>=2.0",
    # HTTP
    "httpx>=0.27.0",
    # 工具
    "pyyaml>=6.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
