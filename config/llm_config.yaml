# EnzymeCage LLM 节点配置
# 2026-07-22 换后端：OpenAI-compat (MaaS)，模型统一 kimi/kimi-k3
# 每个节点独立 override（如轻量任务可换 turbo 类模型省 token）

nodes:
  # ══════════════════════════════════════════════════════════════
  # M3 MVP 节点
  # ══════════════════════════════════════════════════════════════

  substrate_node:
    provider: openai_compat
    model: kimi/kimi-k3             # 仅负责从自然语言提取化学名字，SMILES 交给 PubChem（见 chem_name_resolver.py）。
                                    # 2026-07-22 重构：之前 LLM 直接生成 SMILES 实测正确率仅 2/5，
                                    # 现已降为“名字归一”小任务，reasoning 需求高度下降。
    temperature: 0.1
    max_tokens: 500                # 名字提取不需长 reasoning
    timeout: 90

  orchestrator_node:               # M3: pass-through，不调用 LLM
    provider: openai_compat
    model: kimi/kimi-k3
    temperature: 0.1
    max_tokens: 2000               # 若 M4 启用，需给 reasoning 留额度
    timeout: 120
    enabled: false                 # M3 设为 false

  # ══════════════════════════════════════════════════════════════
  # M5 扩展节点
  # ══════════════════════════════════════════════════════════════

  llm_reranking_node:
    provider: openai_compat
    model: kimi/kimi-k3            # 重排序需要强推理
    temperature: 0.2
    max_tokens: 4000
    timeout: 120

  microbe_selection_node:
    provider: openai_compat
    model: kimi/kimi-k3            # 综合判断需要大模型
    temperature: 0.2
    max_tokens: 4000
    timeout: 120

  reaction_prediction_node:
    provider: openai_compat
    model: kimi/kimi-k3            # 反应预测需要化学知识
    temperature: 0.3
    max_tokens: 2000
    timeout: 120

  evidence_synthesis_node:
    provider: openai_compat
    model: kimi/kimi-k3            # 摘要拼接
    temperature: 0.1
    max_tokens: 2000
    timeout: 60
    enabled: false                 # 当前用确定性模板，不调 LLM
